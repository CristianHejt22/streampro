<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente oficial StreamePro (Sky-400 -> Blue-600 -> Indigo-600) -->
    <linearGradient id="streamepro-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="streamepro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Contenedor cuadrado redondeado idéntico al logo principal de la aplicación -->
  <rect 
    x="5" 
    y="5" 
    width="90" 
    height="90" 
    rx="26" 
    ry="26" 
    fill="url(#streamepro-grad)" 
    stroke="rgba(255, 255, 255, 0.28)" 
    stroke-width="3" 
  />

  <!-- Ícono principal: Reproductor en círculo con trazo elegante -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" filter="url(#streamepro-shadow)">
    <!-- Círculo exterior (v21 12a9 9 0 11-18 0 9 9 0 0118 0z) -->
    <circle cx="50" cy="50" r="32" stroke-width="6.5" />
    <!-- Triángulo de Play (14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132) -->
    <path 
      d="M44 37.5 L64 50 L44 62.5 Z" 
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="4" 
      stroke-linejoin="round" 
    />
  </g>
</svg>
