<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="sproIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>
    <linearGradient id="sproIconPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="sproIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect x="5" y="5" width="90" height="90" rx="28" fill="url(#sproIconGrad)" opacity="0.3" filter="url(#sproIconGlow)" />

  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#0D1322" stroke="url(#sproIconGrad)" stroke-width="3" />

  <!-- Play Symbol -->
  <polygon points="35,26 73,50 35,74" fill="url(#sproIconGrad)" opacity="0.4" filter="url(#sproIconGlow)" />
  <polygon points="37,28 71,50 37,72" fill="url(#sproIconPlay)" />

  <!-- Tech Accent Dot -->
  <circle cx="68" cy="50" r="4.5" fill="#FF0844" />
</svg>
