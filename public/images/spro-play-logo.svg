<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 90" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sproGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>
    <linearGradient id="sproGradPlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="sproGradPlayText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="50%" stop-color="#FF4E50" />
      <stop offset="100%" stop-color="#F9D423" />
    </linearGradient>
    <filter id="sproGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container Group -->
  <g transform="translate(10, 10)">
    <!-- Ambient Glow -->
    <rect x="2" y="2" width="66" height="66" rx="20" fill="url(#sproGradIcon)" opacity="0.3" filter="url(#sproGlow)" />
    
    <!-- Outer Shield / Rounded Box -->
    <rect x="0" y="0" width="70" height="70" rx="20" fill="#0D1322" stroke="url(#sproGradIcon)" stroke-width="2.5" />
    
    <!-- Subtle Inner Accent Pattern -->
    <path d="M 12 22 Q 35 10 58 22" stroke="#00F2FE" stroke-width="1.5" stroke-linecap="round" opacity="0.4" fill="none" />
    
    <!-- Play Triangle Symbol -->
    <polygon points="26,20 54,35 26,50" fill="url(#sproGradIcon)" filter="url(#sproGlow)" opacity="0.4" />
    <polygon points="27,21 52,35 27,49" fill="url(#sproGradPlay)" />
    
    <!-- Modern Tech Accent on Play Dot -->
    <circle cx="50" cy="35" r="3" fill="#FF0844" />
  </g>

  <!-- Typography Group -->
  <!-- SPRO -->
  <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="1">
    SPRO
  </text>

  <!-- PLAY -->
  <text x="216" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="url(#sproGradPlayText)" letter-spacing="1">
    PLAY
  </text>

  <!-- Subtitle Badge / Slogan -->
  <rect x="96" y="60" width="168" height="18" rx="6" fill="#1E293B" opacity="0.8" />
  <circle cx="106" cy="69" r="3" fill="#00F2FE" />
  <text x="116" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#94A3B8" letter-spacing="2">
    STREAMING PRO
  </text>
</svg>
